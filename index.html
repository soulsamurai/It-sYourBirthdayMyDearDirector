<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Праздничная Викторина — С Днём Рождения! 🎂</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Background canvases -->
<canvas id="bgCanvas"></canvas>
<canvas id="balloonCanvas"></canvas>

<!-- ===== BALLOON POPPING ZONE (big touch area for mobile) ===== -->
<div class="balloon-zone" id="balloonZone">
    <div class="balloon-zone-inner">
        <div class="balloon-zone-emoji">🎈</div>
        <p class="balloon-zone-title">Лопни шарик!</p>
        <p class="balloon-zone-hint">Нажимай на летящие шарики — внутри пожелания и сюрпризы</p>
    </div>
</div>

<!-- ===== WISH MODAL (appears on balloon pop) ===== -->
<div class="wish-overlay" id="wishOverlay">
    <div class="wish-modal" id="wishModal">
        <!-- Photo peeking at 45° -->
        <div class="wish-photo-wrapper" id="wishPhotoWrapper">
            <img id="wishPhoto" src="" alt="Сотрудник">
        </div>
        <div class="wish-emoji-top" id="wishEmojiTop">🎉</div>
        <h2 class="wish-heading">Пожелание</h2>
        <p class="wish-text" id="wishText"></p>
        <button class="wish-continue-btn" id="wishContinueBtn">Продолжить 🎈</button>
    </div>
</div>

<!-- Header -->
<div class="header">
    <div class="emoji-row">🎈🎂🎁🎉🎊🎂🎈</div>
    <h1>С Днём Рождения!</h1>
    <p class="subtitle">Праздничная Викторина — проверь свои знания!</p>
</div>

<!-- Score bar -->
<div class="score-bar">
    <div class="score-item">✅ Верно: <span id="correctCount">0</span></div>
    <div class="score-item">❌ Ошибки: <span id="wrongCount">0</span></div>
</div>

<!-- Progress -->
<div class="progress-wrapper">
    <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-label" id="progressLabel">Отвечено: 0 / 10</div>
</div>

<div class="tip-bar">💡 Нажимай на воздушные шарики, чтобы лопнуть их!</div>

<!-- Quiz -->
<div class="quiz-container" id="quizContainer"></div>

<!-- Result -->
<div class="result-panel" id="resultPanel">
    <h2>🎉 Результат 🎉</h2>
    <div class="result-score" id="resultScore"></div>
    <p class="result-text" id="resultText"></p>
    <button class="restart-btn" onclick="restartQuiz()">🔄 Играть снова</button>
</div>

<!--
  =====================================================
  📸 ФОТОГРАФИИ СОТРУДНИКОВ — КАК ДОБАВИТЬ:
  =====================================================
  
  1. Создайте папку "photos" рядом с index.html
  2. Положите туда фотографии с именами:
       photos/1.jpg
       photos/2.jpg
       photos/3.jpg
       ... и так далее (до 10 штук)
  
  3. Поддерживаемые форматы: .jpg, .png, .webp
  4. Рекомендуемый размер: 300×300px (квадрат)
  5. Фото автоматически привязаны к пожеланиям
     в массиве wishes[] в файле script.js
  
  Если файла нет — вместо фото покажется эмодзи 🎂
  =====================================================
-->

<script src="script.js"></script>
</body>
</html>
