<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎂 Праздничная Викторина 🎂</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Background canvases (always visible) -->
<canvas id="bgCanvas"></canvas>
<canvas id="balloonCanvas"></canvas>

<!-- ===== PAGE 0: WELCOME (balloon popping) ===== -->
<div class="page active" id="page-welcome">
    <div class="welcome-content">
        <div class="welcome-emoji"> 🎈 </div>
        <h1 class="welcome-title"> Лопни шарик! </h1>
        <p class="welcome-sub"> Будет очень интересно, так что разомни палец  перед началом 🐱‍👤</p>
        <button class="start-btn" id="startQuizBtn"> Начать викторину 🎉 </button>
    </div>
</div>

<!-- ===== PAGES 1-16: QUESTIONS (generated by JS) ===== -->

<!-- ===== PAGE 18: RESULTS ===== -->
<div class="page" id="page-result">
    <div class="result-content">
        <div class="result-hero">
            <div class="result-emoji" id="resultEmoji">🏆</div>
            <div class="result-rank" id="resultRank">Знаток!</div>
            <h2 class="result-heading">Итоги викторины</h2>
            <p class="result-subtitle" id="resultSubtitle"></p>
            <div class="result-achievements" id="resultAchievements"></div>
        </div>

        <div class="result-score-block">
            <div class="result-progress-ring">
                <svg viewBox="0 0 120 120" aria-hidden="true">
                    <defs>
                        <linearGradient id="resultRingGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#ff6ec7"/>
                            <stop offset="100%" stop-color="#ffd700"/>
                        </linearGradient>
                    </defs>
                    <circle class="result-ring-bg" cx="60" cy="60" r="52"></circle>
                    <circle class="result-ring-fill" id="resultRingFill" cx="60" cy="60" r="52"></circle>
                </svg>
                <div class="result-score-center">
                    <div class="result-score" id="resultScore">0 / 16</div>
                    <div class="result-percent" id="resultPercent">0%</div>
                </div>
            </div>
        </div>

        <div class="result-stats-grid">
            <div class="result-stat-card">
                <span class="result-stat-icon">✅</span>
                <span class="result-stat-value" id="statCorrect">0</span>
                <span class="result-stat-label">Вопросов пройдено</span>
            </div>
            <div class="result-stat-card">
                <span class="result-stat-icon">⭐</span>
                <span class="result-stat-value" id="statFirstTry">0</span>
                <span class="result-stat-label">С первой попытки</span>
            </div>
            <div class="result-stat-card">
                <span class="result-stat-icon">❌</span>
                <span class="result-stat-value" id="statWrong">0</span>
                <span class="result-stat-label">Ошибок</span>
            </div>
            <div class="result-stat-card">
                <span class="result-stat-icon">🎯</span>
                <span class="result-stat-value" id="statAccuracy">0%</span>
                <span class="result-stat-label">Точность</span>
            </div>
        </div>

        <div class="result-breakdown">
            <h3 class="result-breakdown-title">📋 Разбор по вопросам</h3>
            <div class="result-breakdown-list" id="resultBreakdown"></div>
        </div>

        <p class="result-text" id="resultText"></p>
        <button class="start-btn" onclick="restartQuiz()">🔄 Играть снова</button>
    </div>
</div>

<!-- ===== WISH MODAL ===== -->
<div class="wish-overlay" id="wishOverlay">
    <canvas id="wishConfettiCanvas"></canvas>
    <div class="wish-modal">
        <div class="wish-photo-wrapper" id="wishPhotoWrapper">
            <img id="wishPhoto" src="" alt="Сотрудник">
        </div>
        <div class="wish-emoji-top" id="wishEmojiTop">🎉</div>
        <h2 class="wish-heading">Пожелание</h2>
        <p class="wish-text" id="wishText"></p>
        <button class="wish-continue-btn" id="wishContinueBtn">Продолжить 🎈</button>
    </div>
</div>

<!-- ===== VIDEO MODAL ===== -->
<div class="video-overlay" id="videoOverlay">
    <div class="video-modal">
        <button class="video-close-btn" id="videoCloseBtn">✕</button>
        <div class="video-container" id="videoContainer">
            <!-- iframe will be inserted here -->
        </div>
    </div>
</div>

<!--
  =====================================================
  📸 ФОТОГРАФИИ СОТРУДНИКОВ (пожелания):
     photos/1.jpg ... photos/10.jpg
  
  🎈 ФОТО ВМЕСТО ШАРИКОВ (круглые, летающие):
     balloons/1.jpg ... balloons/N.jpg
  
  🎬 ВИДЕО ДЛЯ ВОПРОСОВ:
     В массиве quizData в script.js укажите URL видео
     (YouTube embed, Vimeo, или прямая ссылка на .mp4)

  🖼️ ФОТО К ВОПРОСАМ:
     В quizData укажите imageUrl (например questions/q12.png)
  =====================================================
-->

<script src="script.js"></script>
</body>
</html>
